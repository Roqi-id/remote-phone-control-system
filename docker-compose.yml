version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: remote-phone-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - remote-phone-network

  redis:
    image: redis:7-alpine
    container_name: remote-phone-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - remote-phone-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remote-phone-backend
    restart: always
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/remote-phone-control?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_here
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      PORT: 5000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - remote-phone-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: remote-phone-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_SOCKET_URL: http://localhost:5001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - remote-phone-network

volumes:
  mongodb_data:
  redis_data:

networks:
  remote-phone-network:
    driver: bridge
